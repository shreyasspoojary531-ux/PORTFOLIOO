<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Solid Black Canvas Background -->
  <rect width="64" height="64" rx="14" fill="#000000" />
  
  <!-- Architectural Border Ring -->
  <rect x="3" y="3" width="58" height="58" rx="11" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" />
  
  <!-- Corner Tech Accent Crosshairs -->
  <path d="M 8 14 H 14 M 14 8 V 14" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" />
  <path d="M 56 50 H 50 M 50 56 V 50" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1" />

  <!-- Monogram "S" Geometry in Crisp White -->
  <path
    d="M 42 21 C 42 16.5 37.5 14 32 14 C 24.5 14 20 18.5 20 23.5 C 20 32 44 30 44 39.5 C 44 45.5 38.5 50 31.5 50 C 23.5 50 18.5 45 18 39.5"
    stroke="#FFFFFF"
    stroke-width="5.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Subtle Accent Dot Matrix -->
  <circle cx="43" cy="43" r="1.5" fill="#FFFFFF" opacity="0.6" />
</svg>